name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version
        id: version
        run: |
          [xml]$csproj = Get-Content BtPicker\BtPicker.csproj
          $v = $csproj.Project.PropertyGroup.Version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check tag exists
        id: check
        run: |
          git fetch --tags
          $tag = git tag -l "v${{ steps.version.outputs.version }}"
          if ($tag) { echo "exists=true" >> $env:GITHUB_OUTPUT } else { echo "exists=false" >> $env:GITHUB_OUTPUT }

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: dotnet publish BtPicker -c Release -r win-x64 --self-contained -o publish

      - name: Zip
        if: steps.check.outputs.exists == 'false'
        run: Compress-Archive -Path publish\* -DestinationPath BtPicker-win-x64.zip

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: BtPicker-win-x64.zip
          generate_release_notes: true
